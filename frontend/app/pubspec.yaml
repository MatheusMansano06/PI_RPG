name: projeto_integrador_jogo
description: "Aplicativo gamificado para orientar calouros pelo Campus I da PUC-Campinas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/audio/
    - assets/musicas/
